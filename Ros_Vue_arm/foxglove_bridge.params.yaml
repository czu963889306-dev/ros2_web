/**:
  ros__parameters:
    address: "0.0.0.0"
    port: 8765
    include_hidden: true
    num_threads: 1
    min_qos_depth: 1
    max_qos_depth: 1
    send_buffer_limit: 10000000
    topic_whitelist:
      - "^/web/map_inputs/.+$"
      - "^/battery_state$"
      - "^/odom$"
      - "^/map$"
      - "^/mapping_3d/cloud_map$"
      - "^/mapping_3d/robot_pose$"
      - "^/global_costmap/costmap$"
      - "^/scan$"
      - "^/web/tf$"
      - "^/tf_static$"
      - "^/joint_states$"
      - "^/robot_description$"
      - "^/web/odometry/filtered$"
      - "^/plan$"
      - "^/navigate_to_pose/_action/feedback$"
      - "^/lite_navigation/feedback$"
    client_topic_whitelist:
      - "^/cmd_vel$"
      - "^/servo_cmd$"
      - "^/goal_pose$"
      - "^/initialpose$"
      - "^/lite_navigation/cancel$"
      - "^/navigation/cancel$"
    service_whitelist:
      - "^/global_costmap/clear_entirely_global_costmap$"
      - "^/local_costmap/clear_entirely_local_costmap$"
    param_whitelist:
      - "(?!)"
    capabilities:
      - "clientPublish"
      - "services"
